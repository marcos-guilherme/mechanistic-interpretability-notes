[project]
name = "refusal-direction-replication"
version = "0.1.0"
description = "Focused replication of refusal directions in instruction-tuned LLMs."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==0.31.0",
    "datasets==2.19.2",
    "einops==0.8.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "safetensors>=0.4",
    "torch>=2.3",
    "transformers==4.44.2",
]

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
